  .eyebrow{ font-size:11px; letter-spacing:0.28em; opacity:0.75; font-weight:500; position:relative; z-index:1; }
  h1{ font-family:'Shippori Mincho', serif; font-size:30px; font-weight:700; margin-top:4px; letter-spacing:0.02em; position:relative; z-index:1; }
  h1 span{ color:var(--amber); }
  .sub{ font-size:12.5px; opacity:0.8; margin-top:6px; line-height:1.5; position:relative; z-index:1; }
  .inline-fox{ height:1.7em; width:auto; vertical-align:middle; margin-left:5px; opacity:0.95; }

  .search-wrap{ padding:14px 20px 0; }
  .search-box{
    display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--ice);
    border-radius:999px; padding:10px 16px; box-shadow:0 2px 8px rgba(20,50,60,0.06);
  }
  .search-box svg{ flex-shrink:0; opacity:0.5; }
  .search-box input{ border:none; outline:none; font-family:inherit; font-size:14px; width:100%; background:transparent; color:var(--forest); }
  .search-box input::placeholder{ color:#9AA5A3; }
  .footer-notes{ font-size:9.5px; color:#B7C0BE; text-align:center; padding:14px 30px 30px; line-height:1.7; }

  .tabs{ display:flex; gap:6px; padding:14px 16px 10px; overflow-x:auto; }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:9px 4px 10px; border-radius:12px; border:1.5px solid transparent;
    background:transparent; cursor:pointer; font-family:inherit; color:#6B7A78; transition:all .18s ease;
  }
  .tab .ic{
    line-height:1; display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%; border:1.6px solid transparent;
    transition:background .15s ease, border-color .15s ease;
  }
  .tab .ic svg{ width:18px; height:18px; display:block; }
  .tab[data-cat="scenic"] .ic{ border-color:var(--c-scenic); color:var(--c-scenic); }
  .tab[data-cat="food"] .ic{ border-color:var(--c-food); color:var(--c-food); }
  .tab[data-cat="onsen"] .ic{ border-color:var(--c-onsen); color:var(--c-onsen); }
  .tab.active[data-cat="scenic"] .ic{ background:var(--c-scenic); color:#fff; }
  .tab.active[data-cat="food"] .ic{ background:var(--c-food); color:#fff; }
  .tab.active[data-cat="onsen"] .ic{ background:var(--c-onsen); color:#fff; }
  .tab .lb{ font-size:10.5px; font-weight:700; letter-spacing:0.02em; }
  .tab.active{ background:#EFF4F3; border-color:var(--ice); color:var(--forest); }

  .map-wrap{
    margin:6px 20px 0; background:var(--card); border:1px solid var(--ice);
    border-radius:var(--radius); padding:12px 12px 6px; box-shadow:0 2px 10px rgba(20,50,60,0.05);
  }
  .map-title{ font-size:10.5px; font-weight:700; color:#7E8A88; letter-spacing:0.05em; margin-bottom:2px; display:flex; justify-content:space-between; align-items:center; min-height:24px; }
  #mapLabel{ display:flex; align-items:baseline; gap:3px; }
  #mapLabel .place{
    font-family:'Shippori Mincho', serif; font-size:17px; font-weight:700;
    color:var(--forest); letter-spacing:0.02em;
  }
  #mapLabel .suffix{ font-size:11px; font-weight:500; color:#8B978F; }
  #mapLabel .hint-text{ font-size:10.5px; font-weight:700; color:#7E8A88; letter-spacing:0.05em; }
  .map-back{
    display:none; align-items:center; gap:3px; font-size:10.5px; font-weight:700;
    color:var(--biei-blue); background:#EEF4F6; border:none; border-radius:999px;
    padding:4px 10px; cursor:pointer; font-family:inherit;
  }
  .map-back.show{ display:inline-flex; }
  .map-hint{ font-size:10px; color:#AAB4B2; text-align:center; margin-top:4px; }
  svg#hokkaido{ width:100%; height:auto; display:block; touch-action:manipulation; overflow:hidden; }
  #mapZoomGroup{ transition:transform 0.5s cubic-bezier(.22,.9,.32,1); }
  #hokkaido .muni{
    stroke-width:1; stroke-linejoin:round; cursor:pointer; vector-effect:non-scaling-stroke;
    transition:filter .15s ease, opacity .15s ease, fill-opacity .25s ease, stroke .25s ease;
  }
  #hokkaido .muni.region-hover{ filter:brightness(1.15); }
  #hokkaido .muni.faded{ opacity:0.20; cursor:default; }
  /* ズーム中、選択エリアだけ色を薄くして市町村境界をはっきり見せる */
  #hokkaido .muni.muni-active{
    fill-opacity:0.38;
    stroke:#3E4F4D !important;
    stroke-width:1.3;
  }
  /* タップして選択した市町村は、周りよりくっきり濃く */
  #hokkaido .muni.muni-selected{
    fill-opacity:0.88;
    stroke:#23302E !important;
    stroke-width:1.6;
  }
  #hokkaido .region-label{
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:24px;
    fill:#FFFFFF; stroke:rgba(20,30,30,0.38); stroke-width:4px; paint-order:stroke fill;
    text-anchor:middle; dominant-baseline:middle; pointer-events:none; letter-spacing:0.08em;
    transition:opacity .25s ease;
  }
  #hokkaido.is-zoomed .region-label{ opacity:0; }

  .pin{ cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .pin .hitzone{ fill:transparent; }
  .pin circle.dot{ stroke:#fff; stroke-width:2; vector-effect:non-scaling-stroke; transition:r .12s ease, opacity .12s ease; }
  .pin.dim circle.dot{ opacity:0.22; }
  .pin.dim text{ opacity:0.22; }
  .pin:hover circle.dot,
  .pin:active circle.dot{ r:11; }
  .pin text{
    font-size:12px; font-weight:700; fill:#2A3634; font-family:'Zen Kaku Gothic New', sans-serif; pointer-events:none;
    paint-order:stroke; stroke:#FAFAF7; stroke-width:3px; vector-effect:non-scaling-stroke;
  }

  .list{ padding:10px 20px 20px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .card{
    background:var(--card); border:1px solid var(--ice); border-radius:var(--radius);
    padding:14px 15px; box-shadow:0 2px 8px rgba(20,50,60,0.04);
    border-left:4px solid var(--card-accent, var(--ice));
  }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card-name-wrap{ flex:1; min-width:0; }
  .card-icons{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--ice); background:#F7F9F8;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:#57625F;
    padding:0; transition:background .15s ease, color .15s ease;
  }
  .icon-btn:hover{ background:#EFF4F3; color:var(--forest); }
  .icon-btn.has-photo{ color:#fff; border-color:transparent; }
  .icon-btn svg{ width:15px; height:15px; }

  /* ---------- 合言葉ゲート ---------- */
  #gate{
    position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(155deg, var(--biei-blue) 0%, #1B4358 65%, #123240 100%);
    padding:24px;
  }
  #gate.hidden{ display:none; }
  .gate-card{
    width:100%; max-width:340px; background:var(--snow); border-radius:20px;
    padding:32px 26px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.3);
  }
  .gate-title{ font-family:'Shippori Mincho', serif; font-size:24px; font-weight:700; color:var(--forest); }
  .gate-sub{ font-size:12.5px; color:#7E8A88; margin-top:6px; margin-bottom:22px; }
  .gate-input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--ice);
    font-family:inherit; font-size:15px; text-align:center; outline:none; letter-spacing:0.05em;
  }
  .gate-input:focus{ border-color:var(--biei-blue); }
  .gate-btn{
    width:100%; margin-top:12px; padding:12px; border-radius:12px; border:none;
    background:var(--biei-blue); color:#fff; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  }
  .gate-error{ font-size:11.5px; color:#B5573B; margin-top:10px; min-height:14px; }
  .phone.locked{ display:none; }

  /* ---------- 写真ビューアー（モーダル） ---------- */
  .photo-modal{
    position:fixed; inset:0; z-index:100; display:none;
    align-items:center; justify-content:center; padding:24px;
  }
  .photo-modal.show{ display:flex; }
  .photo-modal-backdrop{ position:absolute; inset:0; background:rgba(15,25,30,0.72); }
  .photo-modal-content{
    position:relative; background:var(--card); border-radius:18px; overflow:hidden;
    max-width:400px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.3);
  }
  .photo-modal-close{
    position:absolute; top:10px; right:10px; z-index:2; width:30px; height:30px; border-radius:50%;
    border:none; background:rgba(20,30,30,0.55); color:#fff; font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .photo-modal-body img{ width:100%; height:auto; display:block; }
  .photo-modal-actions{ padding:12px 16px 16px; display:flex; justify-content:center; }
  .photo-replace-btn, .photo-add-btn{
    font-family:inherit; font-size:12.5px; font-weight:700; color:var(--biei-blue);
    background:#EEF4F6; border:none; border-radius:999px; padding:9px 18px; cursor:pointer;
  }
  .photo-add-btn{ margin-top:6px; }
  .photo-placeholder{
    padding:56px 24px; text-align:center; color:#9AA5A3;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .photo-placeholder svg{ width:40px; height:40px; opacity:0.5; }
  .photo-placeholder-title{ font-size:13px; font-weight:700; color:#57625F; }
  .photo-placeholder-sub{ font-size:11.5px; line-height:1.6; }
  .card-name{ font-family:'Shippori Mincho', serif; font-size:16.5px; font-weight:700; color:var(--forest); }
  .cat-icon{ display:inline-flex; vertical-align:-3px; margin-right:4px; }
  .cat-icon svg{ width:15px; height:15px; display:block; }
  .badges{ display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .badge-area{ font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .badge-region{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; background:#F1F4F3; color:#7E8A88; }
  .card-desc{ font-size:12.5px; line-height:1.65; color:#57625F; margin-top:9px; }
  .card-tags{ margin-top:9px; display:flex; gap:6px; flex-wrap:wrap; }
  .tag{ font-size:10px; color:#7E8A88; background:#F1F4F3; border-radius:6px; padding:3px 7px; }
  .empty{ text-align:center; padding:60px 20px; color:#9AA5A3; font-size:13px; line-height:1.8; }

  @keyframes pulseCard{
    0%{ box-shadow:0 0 0 0 var(--card-accent, #888); }
    35%{ box-shadow:0 0 0 6px var(--card-accent, #888); }
    100%{ box-shadow:0 2px 8px rgba(20,50,60,0.04); }
  }
  .card.pulse{ animation:pulseCard 0.7s ease-out; }

  @keyframes pinPulse{
    0%{ r:9; }
    45%{ r:15; }
    100%{ r:9; }
  }
  .pin.pin-pulse circle.dot{ animation:pinPulse 0.9s ease-out; }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <div class="gate-title">北海道<span style="color:var(--amber)">めぐり</span></div>
    <div class="gate-sub">合言葉を入力してください</div>
    <input type="password" id="gateInput" class="gate-input" placeholder="合言葉" autocomplete="off">
    <button class="gate-btn" id="gateBtn">開く</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function(){
    const GATE_HASH = "ecaae9d95f4a2f3f9c1f60fc3fe9a42db3ff47a05702dbb800c04756104af8ec";
    const gate = document.getElementById('gate');
    const appRoot = document.getElementById('appRoot');
    const gateInput = document.getElementById('gateInput');
    const gateBtn = document.getElementById('gateBtn');
    const gateError = document.getElementById('gateError');

    async function sha256Hex(text){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    function unlock(){
      gate.classList.add('hidden');
      appRoot.classList.remove('locked');
      try{ localStorage.setItem('hkGateUnlocked', '1'); }catch(e){}
    }

    async function tryUnlock(){
      const val = gateInput.value.trim();
      if(!val) return;
      const hash = await sha256Hex(val);
      if(hash === GATE_HASH){
        unlock();
      } else {
        gateError.textContent = '合言葉が違います';
        gateInput.value = '';
        gateInput.focus();
      }
    }

    gateBtn.addEventListener('click', tryUnlock);
    gateInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') tryUnlock(); });

    // 一度解除したこの端末では、次回から自動で開く
    try{
      if(localStorage.getItem('hkGateUnlocked') === '1') unlock();
    }catch(e){}
  });
</script>

      {name:"はまなすの丘公園", area:"稚内市", region:"dohoku", x:175, y:10, desc:"宗谷海峡を望む海浜公園。夏はハマナスの花が咲き誇り、日本海に沈む夕日も美しい。", tags:["ハマナス","夕日"]},
      {name:"サンゴ草群落地（能取湖）", area:"網走市", region:"douto", x:319, y:142, desc:"能取湖畔を真紅に染める国内最大級のサンゴ草（アッケシソウ）群落。見頃は例年9月頃。", tags:["能取湖","紅葉の絨毯"]},
      {name:"ワッカ原生花園", area:"網走市", region:"douto", x:307, y:130, desc:"オホーツク海と湖に挟まれた砂州に広がる日本最大級の海岸草原。自転車での散策が人気。", tags:["海岸草原","サイクリング"]},
      {name:"開陽台", area:"中標津町", region:"douto", x:368, y:178, desc:"「地球が丸く見える丘」として知られる標高271mの展望台。360度の大パノラマが広がる。", tags:["地球が丸い","パノラマ"]},
      {name:"裏摩周展望台", area:"弟子屈町", region:"douto", x:348, y:179, desc:"摩周湖の裏側から望む静かな展望台。表側より観光客が少なく、神秘的な湖を独り占めできる。", tags:["摩周湖","穴場"]},
      {name:"道の駅なとわ・えさん", area:"函館市", region:"donan", x:121, y:343, desc:"活火山・恵山と津軽海峡を望む道の駅。屋上展望デッキからのパノラマと昆布ソフトが名物。", tags:["道の駅","恵山"]},
      {name:"昭和新山", area:"壮瞥町", region:"doou", x:106, y:274, desc:"1943〜1945年の噴火で麦畑が隆起してできた赤褐色の溶岩ドーム。今も湯気を上げ続ける。", tags:["活火山","溶岩ドーム"]},
      {name:"日の出公園（芝ざくら滝上公園）", area:"滝上町", region:"douto", x:251, y:125, desc:"丘一面をピンクと紫に染める日本最大級の芝桜群落。例年5月上旬から下旬が見頃。", tags:["芝桜","5月限定"]},
      {name:"ひまわりの里", area:"北竜町", region:"doou", x:172, y:166, desc:"23haの畑に150万本のひまわりが咲き誇る北海道最大級のひまわり畑。見頃は7月下旬〜8月中旬。", tags:["ひまわり","北海道最大級"]},
      {name:"ひまわり畑", area:"大空町", region:"douto", x:322, y:153, desc:"女満別空港にほど近い丘陵地に広がるひまわり畑。飛行機と花畑を一緒に楽しめる。", tags:["ひまわり","女満別"]},
      {name:"ノシャップ岬", area:"稚内市", region:"dohoku", x:157, y:13, desc:"宗谷海峡に突き出た岬。晴れた日は利尻富士を望め、水族館やノシャップ岬灯台も隣接。", tags:["利尻富士","灯台"]},
      {name:"宗谷岬", area:"稚内市", region:"dohoku", x:176, y:6, desc:"日本最北端の地を示す記念碑が立つ岬。晴れた日はサハリンを望むことができる。", tags:["最北端","記念碑"]},
      {name:"朱鞠内湖", area:"幌加内町", region:"dohoku", x:192, y:115, desc:"日本最大の人造湖で、冬はワカサギ釣りのメッカ。厳冬期には氷点下30度を下回ることも。", tags:["人造湖","ワカサギ釣り"]},
      {name:"神威岬", area:"積丹町", region:"doou", x:72, y:203, desc:"積丹半島の先端に突き出た岬。「積丹ブルー」と称される透明度抜群の海を遊歩道の先から一望できる。", tags:["積丹ブルー","遊歩道"]},
      {name:"襟裳岬", area:"えりも町", region:"doou", x:262, y:330, desc:"日高山脈が海に沈み込む岬。強風で知られ、断崖からの眺めとゼニガタアザラシの群れが見どころ。", tags:["断崖","アザラシ"]},
      {name:"地球岬", area:"室蘭市", region:"doou", x:115, y:296, desc:"「北海道の自然100選」第1位に選ばれた大絶壁の岬。晴れた日は地球の丸みを感じる大パノラマが広がる。", tags:["絶壁","展望台"]},
      {name:"立待岬", area:"函館市", region:"donan", x:97, y:346, desc:"津軽海峡に突き出た岬。晴れた日には津軽半島まで見渡せ、歌人・石川啄木ゆかりの地としても知られる。", tags:["津軽海峡","石川啄木"]},
      {name:"納沙布岬", area:"根室市", region:"douto", x:430, y:198, desc:"本土最東端の岬。天気が良ければ北方領土の島々を間近に望むことができる。", tags:["本土最東端","北方領土"]},
      {name:"能取岬", area:"網走市", region:"douto", x:327, y:133, desc:"オホーツク海に突き出た断崖の岬。白い灯台と草原が広がり、冬は流氷、夏は牛の放牧風景が楽しめる。", tags:["オホーツク海","流氷"]},
      {name:"三国峠", area:"上川町", region:"dohoku", x:254, y:181, desc:"大雪山系を望む標高1139mの峠。「天空のカフェ」からの原生林の大パノラマが人気。", tags:["天空のカフェ","大雪山"]},
      {name:"スコトン岬", area:"礼文町", region:"dohoku", x:113, y:11, desc:"礼文島最北端の岬。晴れた日はサハリンを望むこともでき、島の最果て感を味わえる。", tags:["最北端","離島"]},
      {name:"澄海岬", area:"礼文町", region:"dohoku", x:114, y:16, desc:"エメラルドグリーンに輝く入江が美しい岬。礼文島屈指のフォトスポットとして人気。", tags:["エメラルドグリーン","入江"]},
      {name:"仙法志御崎公園", area:"利尻町", region:"dohoku", x:130, y:44, desc:"利尻山の溶岩がつくる奇岩が連なる海岸公園。アザラシの餌やり体験も楽しめる。", tags:["奇岩","アザラシ"]},
      {name:"オタトマリ沼", area:"利尻町", region:"dohoku", x:134, y:42, desc:"アカエゾマツ原生林に囲まれた静かな沼。水面に映る「逆さ利尻富士」が美しい。", tags:["逆さ利尻富士","原生林"]},
      {name:"利尻富士", area:"利尻富士町", region:"dohoku", x:129, y:33, desc:"標高1721mの秀峰。日本百名山にも数えられ、島のどこからでもその美しい姿を望める。", tags:["日本百名山","島のシンボル"]},
      {name:"サロベツ原野", area:"豊富町", region:"dohoku", x:161, y:43, desc:"日本最大級の高層湿原が広がる原野。夏はエゾカンゾウなどの湿原植物が咲き誇る。", tags:["湿原","利尻富士も一望"]},
      {name:"サロマ湖", area:"佐呂間町", region:"douto", x:298, y:131, desc:"日本第3位の面積を誇る汽水湖。オホーツク海とつながる砂州にはワッカ原生花園が広がる。", tags:["汽水湖","日本第3位"]},
      {name:"かみゆうべつチューリップ公園", area:"湧別町", region:"douto", x:283, y:129, desc:"120万本のチューリップが咲き誇る公園。風車とチューリップのコントラストが北海道らしい。", tags:["チューリップ","風車"]},
      {name:"北星山ラベンダー園", area:"中富良野町", region:"dohoku", x:208, y:196, desc:"観光リフトで上る町営のラベンダー園。頂上からは十勝岳連峰と富良野盆地の大パノラマが広がる。", tags:["ラベンダー","観光リフト"]},
      {name:"麓郷展望台", area:"富良野市", region:"dohoku", x:218, y:206, desc:"ドラマ「北の国から」の舞台としても知られる麓郷エリアの高台。富良野の丘陵地を一望できる。", tags:["北の国から","丘陵地"]},
      {name:"カムイワッカ湯の滝", area:"斜里町", region:"douto", x:385, y:129, desc:"川そのものが温泉になっている知床の秘湯。硫黄を含む白濁の湯が沢を流れ落ちる。", tags:["天然の露天風呂","秘湯"]},

      {name:"さくらの滝", area:"清里町", region:"douto", x:345, y:167, desc:"6〜8月にサクラマスが滝を飛び越えようとジャンプする姿が見られる名所。", tags:["サクラマス","ジャンプ"]},
      {name:"細岡展望台", area:"釧路町", region:"douto", x:340, y:224, desc:"釧路湿原の東側に位置する展望台。別名「大観望」、蛇行する釧路川と阿寒の山々を一望できる。", tags:["釧路湿原","大観望"]},
      {name:"昆布刈石展望台", area:"えりも町", region:"doou", x:262, y:330, desc:"太平洋を望む断崖の展望台。強風で知られるえりも岬周辺らしい、雄大でワイルドな景観が広がる。", tags:["断崖","太平洋"]},
      {name:"ジュエリーアイス", area:"豊頃町", region:"douto", x:288, y:261, desc:"十勝川が運んだ氷が大津海岸に打ち上げられ、宝石のように輝く冬季限定の絶景。見頃は1〜2月。", tags:["冬季限定","宝石の氷"]},
      {name:"幣舞橋", area:"釧路市", region:"douto", x:336, y:235, desc:"釧路のシンボルとなる橋。四季の女神像が並び、霧の街・釧路ならではの幻想的な夕日や夜景が名物。", tags:["夕日","釧路のシンボル"]},
      {name:"五稜郭タワー", area:"函館市", region:"donan", x:99, y:342, desc:"星形の五稜郭を一望できる展望タワー。春は桜に染まる星形の姿を上空から楽しめる。", tags:["五稜郭","展望タワー"]},
      {name:"小樽青の洞窟", area:"小樽市", region:"doou", x:110, y:213, desc:"クルーズ船で巡る神秘的な青い洞窟。断崖や奇岩が続く積丹エリアの海岸美も楽しめる。", tags:["クルーズ","神秘的な青"]},
      {name:"タウシュベツ川橋梁", area:"上士幌町", region:"douto", x:258, y:196, desc:"糠平湖に沈む「幻の橋」。水位によって姿を現し、朽ちていく様子から人気の秘境スポットに。", tags:["幻の橋","糠平湖"]},
      {name:"黄金岬", area:"留萌市", region:"dohoku", x:156, y:148, desc:"日本海に沈む夕日の名所として知られる岬。晴れた日は焼尻島・天売島まで見渡せる。", tags:["夕日","岬"]},
      {name:"オロロンライン（オトンルイ風力発電所）", area:"幌延町", region:"dohoku", x:160, y:55, desc:"小樽から稚内まで日本海沿いに続く絶景ドライブロード。サロベツ原野に一直線に並ぶ28基の風車が象徴的な景観。", tags:["風車","ドライブロード"]}

let currentCat = "scenic";
let query = "";
// zoomStack: [] = 全体, [{level:'region',key,bbox}] = エリア拡大, [...,{level:'muni',key,bbox}] = 市町村拡大
let zoomStack = [];

const listEl = document.getElementById("list");
const pinLayer = document.getElementById("pinLayer");
const mapLabel = document.getElementById("mapLabel");
const mapBack = document.getElementById("mapBack");
const mapHint = document.getElementById("mapHint");
const searchInput = document.getElementById("searchInput");
const zoomGroup = document.getElementById("mapZoomGroup");
const hokkaidoSvg = document.getElementById("hokkaido");

function currentZoom(){ return zoomStack.length ? zoomStack[zoomStack.length-1] : null; }

// 地図の表示状態（スケール・平行移動）の唯一の管理元。
// タップでのエリア／市町村ズームと、指でのピンチズームの両方がここを更新する。
let currentTransform = { scale:1, tx:0, ty:0 };

function setTransform(scale, tx, ty, animated){
  currentTransform = { scale, tx, ty };
  zoomGroup.style.transition = animated ? '' : 'none';
  zoomGroup.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  if(!animated){
    // force reflow so a later animated change still transitions
    void zoomGroup.offsetWidth;
    zoomGroup.style.transition = '';
  }
  updatePinTransforms();
}

// ピンは常に画面上で一定サイズになるよう、地図の拡大率の逆数をかけて打ち消す。
// これにより拡大するほどピン同士は互いに離れて見え、正確な位置を指しやすくなる。
function updatePinTransforms(){
  const inv = 1 / currentTransform.scale;
  document.querySelectorAll('#pinLayer .pin').forEach(g=>{
    const cx = g.dataset.cx, cy = g.dataset.cy;
    g.setAttribute('transform', `translate(${cx} ${cy}) scale(${inv}) translate(${-cx} ${-cy})`);
  });
}

function applyTransform(bbox, padFactor, maxScale){
  const w = bbox.maxx - bbox.minx, h = bbox.maxy - bbox.miny;
  const cx = (bbox.minx + bbox.maxx) / 2, cy = (bbox.miny + bbox.maxy) / 2;
  let scale = Math.min(VBW / (w * padFactor), VBH / (h * padFactor));
  scale = Math.min(scale, maxScale);
  const tx = VBW/2 - cx*scale;
  const ty = VBH/2 - cy*scale;
  setTransform(scale, tx, ty, true);
}

// ---------- 地図だけのピンチズーム ----------
function clientToSvgPoint(clientX, clientY){
  const rect = hokkaidoSvg.getBoundingClientRect();
  const vb = hokkaidoSvg.viewBox.baseVal;
  return {
    x: (clientX - rect.left) / rect.width * vb.width + vb.x,
    y: (clientY - rect.top) / rect.height * vb.height + vb.y
  };
}

let pinchState = null;
const MIN_SCALE = 0.95, MAX_SCALE = 14;

hokkaidoSvg.addEventListener('touchstart', (e)=>{
  if(e.touches.length === 2){
    e.preventDefault();
    const [t1,t2] = e.touches;
    const dist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
    const midX = (t1.clientX+t2.clientX)/2, midY = (t1.clientY+t2.clientY)/2;
    const svgPt = clientToSvgPoint(midX, midY);
    pinchState = {
      startDist: dist,
      startScale: currentTransform.scale,
      // ピンチ中心の下にある「地図の実座標」を固定するための基準点
      localX: (svgPt.x - currentTransform.tx) / currentTransform.scale,
      localY: (svgPt.y - currentTransform.ty) / currentTransform.scale
    };
    zoomGroup.style.transition = 'none';
  }
}, {passive:false});

hokkaidoSvg.addEventListener('touchmove', (e)=>{
  if(e.touches.length === 2 && pinchState){
    e.preventDefault();
    const [t1,t2] = e.touches;
    const dist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
    const midX = (t1.clientX+t2.clientX)/2, midY = (t1.clientY+t2.clientY)/2;
    let newScale = pinchState.startScale * (dist / pinchState.startDist);
    newScale = Math.max(MIN_SCALE, Math.min(newScale, MAX_SCALE));
    const svgPt = clientToSvgPoint(midX, midY);
    const newTx = svgPt.x - pinchState.localX * newScale;
    const newTy = svgPt.y - pinchState.localY * newScale;
    currentTransform = { scale:newScale, tx:newTx, ty:newTy };
    zoomGroup.style.transform = `translate(${newTx}px, ${newTy}px) scale(${newScale})`;
    updatePinTransforms();
  }
}, {passive:false});

let justPinched = false;
function endPinch(e){
  if(e.touches.length < 2){
    if(pinchState){ justPinched = true; setTimeout(()=>{ justPinched = false; }, 250); }
    pinchState = null;
    zoomGroup.style.transition = '';
  }
}
hokkaidoSvg.addEventListener('touchend', endPinch);
hokkaidoSvg.addEventListener('touchcancel', endPinch);

function refreshMapVisualState(){
  const z = currentZoom();
  document.querySelectorAll('.muni').forEach(el=> el.classList.remove('muni-selected'));

  if(!z){
    document.querySelectorAll('.muni').forEach(el=>{ el.classList.remove('faded'); el.classList.remove('muni-active'); });
    hokkaidoSvg.classList.remove('is-zoomed');
    mapBack.classList.remove('show');
    mapHint.style.display = 'block';
    setTransform(1, 0, 0, true);
  } else if(z.level === 'region'){
    document.querySelectorAll('.muni').forEach(el=>{
      const active = el.dataset.region === z.key;
      el.classList.toggle('faded', !active);
      el.classList.toggle('muni-active', active);
    });
    hokkaidoSvg.classList.add('is-zoomed');
    mapBack.classList.add('show');
    mapHint.style.display = 'none';
    applyTransform(z.bbox, 1.28, 4.2);
  } else if(z.level === 'muni'){
    // 市町村拡大：同じエリア内の市町村は見せたまま、境界線もはっきり表示
    document.querySelectorAll('.muni').forEach(el=>{
      const active = el.dataset.region === z.regionKey;
      el.classList.toggle('faded', !active);
      el.classList.toggle('muni-active', active);
    });
    // タップした市町村だけ、ひときわ濃い色で強調（名前は地図上ではなく上部の見出しで表示）
    document.querySelectorAll(`.muni[data-name="${z.key}"]`).forEach(el=> el.classList.add('muni-selected'));
    hokkaidoSvg.classList.add('is-zoomed');
    mapBack.classList.add('show');
    mapHint.style.display = 'none';
    applyTransform(z.bbox, 1.5, 9);
  }
}

function zoomToRegion(key){
  zoomStack = [{level:'region', key, bbox:REGION_BBOX[key]}];
  refreshMapVisualState();
  render();
}

function zoomToMuni(muniEl, regionKey){
  const b = muniEl.getBBox();
  const bbox = {minx:b.x, maxx:b.x+b.width, miny:b.y, maxy:b.y+b.height};
  zoomStack = [
    {level:'region', key:regionKey, bbox:REGION_BBOX[regionKey]},
    {level:'muni', key:muniEl.dataset.name, regionKey, bbox}
  ];
  refreshMapVisualState();
  render();
}

function zoomBack(){
  zoomStack.pop();
  refreshMapVisualState();
  render();
}

hokkaidoSvg.addEventListener("click", (e)=>{
  if(justPinched) return; // ピンチ終了直後の意図しないクリックを無視
  const muni = e.target.closest(".muni");
  if(!muni) return;
  const z = currentZoom();
  if(!z){
    zoomToRegion(muni.dataset.region);
  } else {
    // エリア表示中・市町村拡大中のどちらからでも、そのエリア内の市町村なら
    // 「戻る」を押さずに直接タップで切り替えられる
    const regionKey = z.level === 'region' ? z.key : z.regionKey;
    if(muni.dataset.region !== regionKey) return;
    zoomToMuni(muni, regionKey);
  }
});

hokkaidoSvg.addEventListener("mouseover", (e)=>{
  if(currentZoom()) return;
  const muni = e.target.closest(".muni");
  if(!muni) return;
  document.querySelectorAll(`.muni[data-region="${muni.dataset.region}"]`).forEach(el=>el.classList.add('region-hover'));
});
hokkaidoSvg.addEventListener("mouseout", (e)=>{
  document.querySelectorAll('.muni.region-hover').forEach(el=>el.classList.remove('region-hover'));
});

mapBack.addEventListener("click", zoomBack);

function render(){
  const cat = DATA[currentCat];
  const catColor = CATEGORY_HEX[currentCat];
  const z = currentZoom();
  if(!z){
    mapLabel.innerHTML = `<span class="hint-text">エリアをタップしてください</span>`;
  } else if(z.level === 'region'){
    mapLabel.innerHTML = `<span class="place">${REGIONS[z.key].label}</span><span class="suffix">の${cat.label}</span>`;
  } else {
    mapLabel.innerHTML = `<span class="place">${z.key}</span><span class="suffix">の${cat.label}</span>`;
  }

  const q = query.trim().toLowerCase();
  function matches(it){
    return !q || it.name.toLowerCase().includes(q) || it.area.toLowerCase().includes(q) ||
      REGIONS[it.region].label.includes(q) ||
      it.tags.some(t=>t.toLowerCase().includes(q)) || it.desc.toLowerCase().includes(q);
  }

  // 現在のタブ・エリアに絞った候補（ピン表示や「まだ登録がありません」判定に使用）
  const tabFiltered = cat.items.filter(it =>{
    if(z && it.region !== (z.level==='region' ? z.key : z.regionKey)) return false;
    if(z && z.level === 'muni' && it.area !== z.key) return false;
    return matches(it);
  });

  pinLayer.innerHTML = "";
  if(z){
    const regionKey = z.level==='region' ? z.key : z.regionKey;
    let candidates = cat.items.filter(it=>it.region===regionKey);
    if(z.level === 'muni') candidates = candidates.filter(it=>it.area===z.key);
    candidates.forEach((it)=>{
      const idx = cat.items.indexOf(it);
      const isHit = tabFiltered.includes(it);
      const g = document.createElementNS("http://www.w3.org/2000/svg","g");
      g.setAttribute("class","pin" + (isHit ? "" : " dim"));
      g.dataset.cx = it.x;
      g.dataset.cy = it.y;
      g.innerHTML = `
        <circle class="hitzone" cx="${it.x}" cy="${it.y}" r="20"></circle>
        <circle class="dot" cx="${it.x}" cy="${it.y}" r="9" fill="${catColor}"></circle>
        <text x="${it.x}" y="${it.y - 15}" text-anchor="middle">${it.name.length>5? it.name.slice(0,4)+'…': it.name}</text>
      `;
      g.addEventListener("click", (e)=>{ e.stopPropagation(); jumpToCard(currentCat, idx); });
      pinLayer.appendChild(g);
    });
  }
  updatePinTransforms();

  // 検索中は、選んでいるタブやエリアに関係なく、全カテゴリから一致するスポットをカードで表示する
  let listItems;
  if(q){
    listItems = [];
    Object.keys(DATA).forEach(catKey=>{
      DATA[catKey].items.forEach((it, idx)=>{
        if(matches(it)) listItems.push({ it, catKey, idx });
      });
    });
  } else {
    listItems = tabFiltered.map(it=>({ it, catKey: currentCat, idx: cat.items.indexOf(it) }));
  }

  listEl.innerHTML = "";
  if(listItems.length === 0){
    let msg;
    if(z && !q){
      const label = z.level==='region' ? REGIONS[z.key].label : z.key;
      msg = `${label}にはまだ${cat.label}が登録されていません。`;
    } else {
      msg = `「${query}」に一致するスポットが見つかりませんでした。<br>別のキーワードや地域名で探してみてください。`;
    }
    listEl.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  listItems.forEach(({it, catKey, idx})=>{
    const color = q ? CATEGORY_HEX[catKey] : catColor;
    const region = REGIONS[it.region];
    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--card-accent", color);
    card.id = "card-"+catKey+"-"+idx;
    card.innerHTML = `
      <div class="card-top">
        <div class="card-name-wrap">
          <div class="card-name">${q ? `<span class="cat-icon" style="color:${CATEGORY_HEX[catKey]}">${CATEGORY_ICON_SVG[catKey]}</span>` : ""}${it.name}</div>
          <div class="badges">
            <span class="badge-area" style="background:${color}1A; color:${color}">${it.area}</span>
            <span class="badge-region">${region.label}</span>
          </div>
        </div>
        <div class="card-icons">
          <button class="icon-btn pin-btn" data-cat="${catKey}" data-idx="${idx}" aria-label="地図で見る" title="地図で見る">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <button class="icon-btn photo-btn${(it.photo || getStoredPhoto(catKey, idx)) ? ' has-photo' : ''}" data-cat="${catKey}" data-idx="${idx}" aria-label="写真を見る" title="写真を見る"${(it.photo || getStoredPhoto(catKey, idx)) ? ` style="background:${color};"` : ''}>
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M8 7l1.3-2h5.4L16 7" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
      </div>
      <div class="card-desc">${it.desc}</div>
      <div class="card-tags">${it.tags.map(t=>`<span class="tag">#${t}</span>`).join("")}</div>
    `;
    listEl.appendChild(card);
  });
}

function jumpToCard(catKey, idx){
  if(query !== ""){
    query = "";
    searchInput.value = "";
    render();
  }
  requestAnimationFrame(()=>{
    const card = document.getElementById("card-"+catKey+"-"+idx);
    if(!card) return;
    card.scrollIntoView({behavior:"smooth", block:"center"});
    card.classList.remove("pulse");
    void card.offsetWidth;
    card.classList.add("pulse");
  });
}

// カードの「ピン」アイコン：地図までスクロールし、その地域／市町村へズームしてピンを光らせる
function jumpToMap(catKey, idx){
  const it = DATA[catKey].items[idx];
  if(!it) return;

  if(currentCat !== catKey){
    currentCat = catKey;
    document.querySelectorAll(".tab").forEach(t=> t.classList.toggle("active", t.dataset.cat === catKey));
  }
  if(query !== ""){
    query = "";
    searchInput.value = "";
  }

  const muniEl = document.querySelector(`.muni[data-name="${it.area}"]`);
  if(muniEl){
    zoomToMuni(muniEl, it.region);
  } else {
    zoomToRegion(it.region);
  }
  render();

  document.querySelector(".map-wrap").scrollIntoView({behavior:"smooth", block:"start"});

  requestAnimationFrame(()=>{
    setTimeout(()=>{
      const target = [...document.querySelectorAll('#pinLayer .pin')]
        .find(g => Number(g.dataset.cx) === it.x && Number(g.dataset.cy) === it.y);
      if(target){
        target.classList.remove('pin-pulse');
        void target.offsetWidth;
        target.classList.add('pin-pulse');
      }
    }, 350); // ズームのトランジション後にパルスさせる
  });
}

// カードの「写真」アイコン：写真ビューアーを開く（未登録の場合はプレースホルダー表示）
const photoModal = document.getElementById('photoModal');
const photoModalBody = document.getElementById('photoModalBody');
const photoFileInput = document.getElementById('photoFileInput');
let modalCatKey = null, modalIdx = null;

// 写真はFirebase（Firestore + Cloud Storage）に保存し、全端末でリアルタイムに同期する
function photoStorageKey(catKey, idx){
  const it = DATA[catKey].items[idx];
  return catKey + '::' + it.name;
}

let cloudPhotos = {};       // key(catKey::name) -> 画像URL のキャッシュ
let cloudPhotosReady = false;
const syncStatus = document.getElementById('syncStatus');

function getStoredPhoto(catKey, idx){
  return cloudPhotos[photoStorageKey(catKey, idx)] || null;
}

function startPhotoSync(){
  if(!window.firebasePhotos){
    setTimeout(startPhotoSync, 200); // Firebaseモジュールの読み込み待ち
    return;
  }
  window.firebasePhotos.subscribe((map, err)=>{
    if(err){
      syncStatus.textContent = '⚠️ 写真の同期でエラーが発生しました（通信環境をご確認ください）';
      return;
    }
    cloudPhotos = map;
    cloudPhotosReady = true;
    syncStatus.textContent = '☁️ 写真は全端末でリアルタイムに同期されます';
    render();
    // 開いているモーダルが今回の更新対象なら、写真も差し替える
    if(photoModal.classList.contains('show') && modalCatKey !== null){
      openPhotoModal(modalCatKey, modalIdx);
    }
  });
}
window.addEventListener('firebase-photos-ready', startPhotoSync);
startPhotoSync();

// 保存・通信量を抑えるため、長辺1280px・JPEG品質0.75程度に軽量化してからアップロードする
function resizeImageFile(file, maxDim=1280, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoFile(catKey, idx, file){
  if(!file) return;
  photoModalBody.innerHTML = `<div class="photo-placeholder"><div class="photo-placeholder-title">アップロード中…</div></div>`;

  // Firebaseの読み込みが終わっていない場合は、少しだけ待ってから再確認する
  if(!window.firebasePhotos){
    for(let i=0; i<15 && !window.firebasePhotos; i++){
      await new Promise(r=>setTimeout(r, 300));
    }
  }
  if(!window.firebasePhotos){
    photoModalBody.innerHTML = `<div class="photo-placeholder"><div class="photo-placeholder-sub" style="color:#B5573B;">クラウドの準備が完了していません。数秒待ってからもう一度お試しいただくか、通常のブラウザ（Safari／Chromeなど）で開き直してみてください。</div></div>`;
    return;
  }

  try{
    const dataUrl = await resizeImageFile(file);
    const key = photoStorageKey(catKey, idx);
    await window.firebasePhotos.upload(key, dataUrl);
    // 実際の表示更新はsubscribe()のリアルタイム通知経由で行われる
  } catch(err){
    console.warn('photo upload failed', err);
    photoModalBody.innerHTML = `<div class="photo-placeholder"><div class="photo-placeholder-sub" style="color:#B5573B;">アップロードに失敗しました。通信環境を確認して、もう一度お試しください。</div></div>`;
  }
}

function openPhotoModal(catKey, idx){
  const it = DATA[catKey].items[idx];
  if(!it) return;
  modalCatKey = catKey; modalIdx = idx;
  const photoSrc = getStoredPhoto(catKey, idx) || it.photo;

  if(photoSrc){
    photoModalBody.innerHTML = `
      <img src="${photoSrc}" alt="${it.name}">
      <div class="photo-modal-actions">
        <button class="photo-replace-btn" id="photoReplaceBtn">📷 写真を変更</button>
      </div>`;
    document.getElementById('photoReplaceBtn').addEventListener('click', ()=> photoFileInput.click());
  } else {
    photoModalBody.innerHTML = `
      <div class="photo-placeholder">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 7l1.3-2h5.4L16 7" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="13.5" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
        <div class="photo-placeholder-title">${it.name}の写真はまだありません</div>
        <div class="photo-placeholder-sub">スマホのカメラロールから写真を追加できます。追加すると他の端末にも自動で反映されます。</div>
        <button class="photo-add-btn" id="photoAddBtn">＋ 写真を追加</button>
      </div>`;
    document.getElementById('photoAddBtn').addEventListener('click', ()=> photoFileInput.click());
  }
  photoModal.classList.add('show');
}
function closePhotoModal(){ photoModal.classList.remove('show'); }

photoFileInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file && modalCatKey !== null){
    handlePhotoFile(modalCatKey, modalIdx, file);
  }
  photoFileInput.value = '';
});

document.getElementById('photoModalClose').addEventListener('click', closePhotoModal);
photoModal.querySelector('.photo-modal-backdrop').addEventListener('click', closePhotoModal);

listEl.addEventListener('click', (e)=>{
  const pinBtn = e.target.closest('.pin-btn');
  if(pinBtn){
    jumpToMap(pinBtn.dataset.cat, Number(pinBtn.dataset.idx));
    return;
  }
  const photoBtn = e.target.closest('.photo-btn');
  if(photoBtn){
    openPhotoModal(photoBtn.dataset.cat, Number(photoBtn.dataset.idx));
  }
});

document.getElementById("tabs").addEventListener("click", (e)=>{
  const btn = e.target.closest(".tab");
  if(!btn) return;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  currentCat = btn.dataset.cat;
  searchInput.value = "";
  query = "";
  render();
});

searchInput.addEventListener("input", (e)=>{
  query = e.target.value;
  render();
});

render();
</script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDZoudXjyyparh6Z0trTUXYb62yhfBWuwc",
    authDomain: "hokkaido-guide.firebaseapp.com",
    projectId: "hokkaido-guide",

  };

  try{
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    window.firebasePhotos = {
      async upload(key, dataUrl){
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        const storageRef = storage.ref('photos/' + key + '.jpg');
        await storageRef.put(blob, { contentType: 'image/jpeg' });
        const url = await storageRef.getDownloadURL();
        await db.collection('photos').doc(key.replace(/\//g, '__')).set({ url, updatedAt: Date.now() });
        return url;
      },
      subscribe(callback){
        db.collection('photos').onSnapshot((snap)=>{
          const map = {};
          snap.forEach(d=>{ map[d.id.replace(/__/g, '/')] = d.data().url; });
          callback(map);
        }, (err)=>{
          console.warn('firestore subscribe error', err);
          callback(null, err);
        });
      }
    };
    window.dispatchEvent(new Event('firebase-photos-ready'));
  } catch(err){
    // このプレビュー環境では外部スクリプト（Firebase）が読み込めないことがあります。
    // 実際にホスティングして開いた際は問題なく動作します。
  }
</script>
